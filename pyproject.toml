[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-proof-videos"
version = "0.1.0"
description = "Turn verified Lean 4 proofs into cinematic, semantically animated videos."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "manim>=0.19,<0.20",
  "Pygments>=2.18",
  "sympy>=1.14,<1.15",
  "antlr4-python3-runtime>=4.11,<4.12",
  "ortools>=9.12,<10",
]

[project.optional-dependencies]
web = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
dev = [
  "pytest>=8",
  "hypothesis>=6.130,<7",
  "ruff>=0.16,<0.17",
  "httpx>=0.28,<1",
]

[project.scripts]
lean-proof-video = "proof_video.render_service:cli_entrypoint"
render-proof = "proof_video.commands.render_proof:main"
render-proof-cache = "proof_video.commands.cache:main"
proof-studio = "proof_video.studio.launcher:main"
review-proof-render = "proof_video.commands.review_render:main"

[tool.setuptools.packages.find]
include = ["proof_video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
